[package]
name = "etch-cli"
version = "0.9.2"
authors = ["David McKay <david@rawkode.dev>", "Bruce Jackson <bjackson@pobox.com>"]
edition = "2021"
license = "MIT"
description = "Declarative configuration management for personal workstations."
repository = "https://github.com/brujack/etch-cli"

[[bin]]
name = "etch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.5.66"
colored = "3.1"
comfy-table = "7"
etch-lib = { path = "../lib", version = "0.9.2" }
petgraph = "0.8"
rhai = { version = "1.24", features = ["serde"] }
strip-ansi-escapes = "0.2"
tracing = "0.1"
tracing-journald = "0.3.2"
tracing-subscriber = "0.3"
update-informer = "1.3"
dirs-next = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
tealr = { version = "0.10.0", features = [
    "mlua",
    "mlua_lua54",
    "tealr_derive",
    "mlua_userdata-wrappers",
    "mlua_serialize",
    "mlua_macros",
    "mlua_vendored",
] }
walkdir = "2.5.0"
gix = { version = "0.80.0", features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls", "status"] }

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
tempfile = "3.26"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
