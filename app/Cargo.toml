[package]
name = "etch-cli"
version = "0.14.0"
authors = ["David McKay <david@rawkode.dev>", "Bruce Jackson <bjackson@pobox.com>"]
edition = "2021"
license = "MIT"
description = "Declarative configuration management for personal workstations."
repository = "https://github.com/brujack/etch-cli"

[[bin]]
name = "etch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.5.66"
colored = "3.1"
comfy-table = "7"
etch-lib = { path = "../lib", version = "0.14.0" }
indexmap = "2"
petgraph = "0.8"
rhai = { version = "1.24", features = ["serde"] }
strip-ansi-escapes = "0.2"
tracing = "0.1"
tracing-journald = "0.3.2"
tracing-subscriber = "0.3"
update-informer = "1.3"
dirs-next = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
gix = { version = "0.87.0", features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls", "status"] }

[dev-dependencies]
assert_cmd = "2.1"
insta = { version = "1", features = ["filters"] }
predicates = "3.1"
sha256 = "1.6"
tempfile = "3.26"
tracing-test = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
missing_debug_implementations = "warn"
# 402 undocumented public items as of 2026-08-02. Recheck: make docs-debt
# Flip to "warn" once documented — see docs/superpowers/README.md backlog.
missing_docs = "allow"

[lints.clippy]
wrong_self_convention = "warn"
