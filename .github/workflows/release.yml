name: Release etch-cli

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v prefix (e.g. 1.2.0)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release etch-cli
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Run tests
        run: make test

      - name: Build release binary
        run: cargo build --release

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match="v*" 2>/dev/null || true)
          if [ -n "${PREV_TAG}" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" || true)
          else
            NOTES=$(git log HEAD --pretty=format:"- %s" || true)
          fi
          DELIMITER="EOF_$(openssl rand -hex 8)"
          {
            printf 'notes<<%s\n' "${DELIMITER}"
            printf '%s\n' "${NOTES}"
            printf '%s\n' "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "v${{ env.VERSION }}"
          body: "${{ steps.notes.outputs.notes }}"
          files: target/release/etch

  sign:
    needs: [release]
    uses: ./.github/workflows/release-sign.yml
    with:
      release_tag: "v${{ inputs.version }}"
      binary_name: etch
    permissions:
      id-token: write
      contents: write
