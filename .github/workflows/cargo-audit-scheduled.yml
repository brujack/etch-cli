name: cargo-audit (scheduled)

on:
  schedule:
    # Weekly run catches newly-published advisories against existing lockfiles
    - cron: "0 6 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8  # v2.87.28
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Run cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119 \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0173 \
            --ignore RUSTSEC-2026-0249 \
            --ignore RUSTSEC-2024-0449 \
            --ignore RUSTSEC-2026-0374 \
            --ignore RUSTSEC-2026-0387
