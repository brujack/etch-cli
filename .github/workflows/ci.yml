name: CI

on:
  pull_request:
    branches:
      - master
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: make test
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Check coverage
        # Coverage gate: 75% on Linux CI (ubuntu-latest). Local macOS measurement is
        # ~80% because macOS provider tests (#[cfg(target_os = "macos")]) add coverage
        # locally but don't run in CI. The structural ceiling on Linux is ~78%.
        run: cargo tarpaulin --exclude-files 'jsonschemagen/*' --fail-under 75
      - name: Coverage with network tests (informational)
        run: cargo tarpaulin --exclude-files 'jsonschemagen/*' -- --include-ignored
        continue-on-error: true

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -e
          wget -qO /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --config .gitleaks.toml --source . --log-opts "HEAD~50..HEAD"
        continue-on-error: true

  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Snyk CLI
        run: |
          curl -sL https://static.snyk.io/cli/latest/snyk-linux -o /tmp/snyk
          chmod +x /tmp/snyk
          sudo mv /tmp/snyk /usr/local/bin/snyk
      - name: Run Snyk code scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test
        continue-on-error: true

  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check docs for stale platform/provider references
        run: bash scripts/check-docs.sh

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mdbook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
      - name: Build docs
        run: mdbook build docs/

  auto-merge:
    name: Auto Merge
    runs-on: ubuntu-latest
    needs: [test, secret-scan, snyk-scan, docs-lint, docs-build]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Auto merge on CI pass
        run: gh pr merge --squash --auto "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
