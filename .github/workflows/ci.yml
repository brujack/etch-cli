name: CI

on:
  pull_request:
    # ready_for_review re-runs the workflow when a draft is marked ready; the
    # default types omit it. labeled re-runs the guard when automerge-ok is
    # applied after the PR opens.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches:
      - master
      - main

# Renovate applies labels in a burst, each firing a `labeled` run; cancel the
# superseded ones. A job-level label filter that skips reads as passing, so the
# filter is not used -- the guard step decides instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-machete and cargo-nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8  # v2.87.28
        with:
          tool: cargo-machete@0.9.2,cargo-nextest@0.9.148
          fallback: none
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned Python toolchain
        # Rendered from dotfiles' uv.lock (pyproject.toml + uv.lock, dotfiles#226).
        # Hash-verified; installs with stock pip, no uv on the runner. Committed
        # copy is kept BYTE-IDENTICAL to dotfiles master so that
        #   diff requirements-ci-test.txt ~/git-repos/personal/dotfiles/requirements-ci-test.txt
        # is itself the staleness check. Sync is manual and periodic by design.
        run: pip install -r requirements-ci-test.txt
      - name: Install shellcheck (pinned)
        env:
          SC_VER: "0.11.0"
          SC_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          curl -fsSL -o /tmp/sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VER}/shellcheck-v${SC_VER}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m755 "/tmp/shellcheck-v${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -q "version: ${SC_VER}"
      - name: Run tests
        run: make lint && cargo nextest run --profile ci
      - name: Run Python tests
        # 90% is the global target, below this job's measured 95.28% on 3.13
        # (run 40726750135). tests/test_requirements_sync.py keeps it at or
        # above 90 and in step with CLAUDE.md.
        run: pytest tests/ -v --cov=scripts --cov-report=term --cov-fail-under=90
      - name: Generate test metrics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/test_metrics.py \
            --repo etch-cli \
            --run-id "${RUN_ID}" \
            --junit target/nextest/ci/junit.xml
      - name: Upload test metrics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-metrics
          path: test-metrics.json
          retention-days: 90
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8  # v2.87.28
        with:
          tool: cargo-tarpaulin@0.37.5
          fallback: none
      - name: Check coverage
        # Coverage gate: 80% on Linux CI (ubuntu-latest). Linux measured 80.17% in PR #83.
        # Local macOS measures ~82% because macOS provider tests (#[cfg(target_os = "macos")])
        # add coverage locally but don't run in CI.
        run: cargo tarpaulin --exclude-files 'jsonschemagen/*' --fail-under 81 --out Json
      - name: Publish coverage badge
        working-directory: ${{ github.workspace }}
        run: |
          PCT=$(python3 -c "import json,math; d=json.load(open('tarpaulin-report.json')); print(math.floor(d['coverage']))")
          if   [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT" -ge 60 ]; then COLOR="orange"
          else                         COLOR="red"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin coverage-data 2>/dev/null && \
            git worktree add /tmp/cov-data coverage-data || \
            git worktree add -b coverage-data --orphan /tmp/cov-data
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > /tmp/cov-data/coverage.json
          cd /tmp/cov-data
          git add .
          git diff --staged --quiet && exit 0
          for _ in 1 2 3; do
            git pull origin coverage-data --rebase 2>/dev/null || true
            git diff --staged --quiet || git commit -m "coverage: coverage.json → ${PCT}%"
            git push origin coverage-data && break
            sleep $((RANDOM % 5 + 1))
          done
      - name: Coverage with network tests (informational)
        run: cargo tarpaulin --exclude-files 'jsonschemagen/*' -- --include-ignored
        continue-on-error: true

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8  # v2.87.28
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Run cargo deny advisories
        # Uses deny.toml ignore list — cargo audit does not read deny.toml
        run: cargo deny check advisories

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VER: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -e
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version | grep -q "${GITLEAKS_VER}"
      - name: Run gitleaks
        run: gitleaks detect --config .gitleaks.toml --source . --log-opts "HEAD~50..HEAD"

  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Snyk CLI (pinned)
        env:
          SNYK_VER: "v1.1308.0"
          SNYK_SHA256: "a916d3ec9e6c27d56cf67664459885512758a1ae94418ba430fcb92e86c32ae1"
        run: |
          curl -fsSL -o /tmp/snyk \
            "https://static.snyk.io/cli/${SNYK_VER}/snyk-linux"
          echo "${SNYK_SHA256}  /tmp/snyk" | sha256sum -c -
          sudo install -m755 /tmp/snyk /usr/local/bin/snyk
          snyk --version | grep -q "${SNYK_VER#v}"
      - name: Run Snyk code scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test

  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check docs for stale platform/provider references
        run: bash scripts/check-docs.sh

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install mdbook (pinned)
        env:
          MDBOOK_VER: "0.5.3"
          MDBOOK_SHA256: "e2fd508a4fac06cbaa9f88b97d27bdc3b55a08946304ca845879fe26a3699e11"
        run: |
          curl -fsSL -o /tmp/mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VER}/mdbook-v${MDBOOK_VER}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  /tmp/mdbook.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/mdbook.tar.gz -C /usr/local/bin
          mdbook --version | grep -q "${MDBOOK_VER}"
      - name: Build docs
        run: mdbook build docs/

  semver-check:
    name: Semver Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch main for baseline
        run: git fetch origin main --depth=1

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8  # v2.87.28
        with:
          tool: cargo-semver-checks@0.51.0
          fallback: none

      - name: Check semver compatibility
        run: cargo semver-checks check-release -p etch-lib --baseline-rev origin/main

  auto-merge:
    name: Auto Merge
    runs-on: ubuntu-latest
    needs: [test, cargo-audit, secret-scan, snyk-scan, docs-lint, docs-build]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Hold unlabelled bot PRs for triage
        id: hold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Renovate's `automerge: false` for majors was bypassed: this job filtered
        # on nothing, so majors auto-merged against the repo's own declared policy.
        #
        # AFFIRMATIVE label, not `!major`. Excluding a negative fails OPEN -- every
        # way labelling can break yields a PR without the label, which an exclusion
        # then merges. Requiring `automerge-ok` fails CLOSED.
        #
        # KEYED ON is_bot, not a login string. Matching `app/renovate` alone let
        # every other bot (dependabot, github-actions[bot], a changed login form)
        # fall through to merge. Any bot needs the AFFIRMATIVE `automerge-ok`
        # label; humans merge as before. An empty login or an unreadable is_bot
        # exits red: unknown is not safe.
        #
        # The GITHUB_OUTPUT + `if:` on the merge step is load-bearing. An earlier
        # draft used `exit 0` in this step to hold -- which does NOT stop the next
        # step, so the merge ran anyway while the log claimed it was held. Do not
        # re-split this into an exit-code guard.
        #
        # Exit codes differ on purpose: a missing label is NORMAL (green, held); a
        # failed author or label query is a BROKEN INSTRUMENT (red), because
        # falling through to merge on a query failure is the guard disabling
        # itself quietly.
        run: |
          author=$(gh pr view "${PR_NUMBER}" --json author --jq '[.author.is_bot, .author.login] | @tsv') \
            || { echo "cannot determine PR author -- refusing to auto-merge" >&2; exit 1; }
          is_bot=${author%%$'\t'*}
          login=${author#*$'\t'}
          if [ -z "${login}" ]; then
            echo "empty PR author login -- refusing to auto-merge" >&2
            exit 1
          fi
          if [ "${is_bot}" != "true" ] && [ "${is_bot}" != "false" ]; then
            echo "unreadable is_bot (${is_bot}) -- refusing to auto-merge" >&2
            exit 1
          fi
          if [ "${is_bot}" = "true" ]; then
            labels=$(gh pr view "${PR_NUMBER}" --json labels --jq '.labels[].name') \
              || { echo "cannot read PR labels -- refusing to auto-merge" >&2; exit 1; }
            printf '%s\n' "${labels}" | grep -qx 'automerge-ok' \
              || { echo "bot PR (${login}) lacks automerge-ok -- leaving open for triage"
                   echo "merge=false" >> "${GITHUB_OUTPUT}"
                   exit 0; }
          fi
          echo "merge=true" >> "${GITHUB_OUTPUT}"
          echo "cleared to merge (author=${login}, is_bot=${is_bot})"

      - name: Auto merge on CI pass
        if: steps.hold.outputs.merge == 'true'
        run: gh pr merge --squash --auto "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
