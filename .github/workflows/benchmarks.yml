name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 1 * *" # 1st of month, 2am UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Run benchmarks
        run: |
          # --bench etch_lib, not a bare `cargo bench`: the bare form also runs
          # the lib's default libtest harness, which rejects Criterion's
          # --output-format and aborts before any benchmark runs. That produced
          # an empty output.txt and a failure attributed to the store step
          # below, every monthly run since 2026-06-01.
          #
          # set -o pipefail because the Actions default run: shell is `bash -e`
          # without it, so tee's 0 was masking cargo's 101. Dropping 2>/dev/null
          # keeps the reason visible next time.
          set -o pipefail
          cargo bench -p etch-lib --bench etch_lib \
            -- --output-format bencher | tee output.txt
          if [[ ! -s output.txt ]]; then
            printf 'no benchmark output produced\n' >&2
            exit 1
          fi

      - uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          comment-on-alert: true
          alert-threshold: "130%"
          fail-on-alert: false
