[graph]
targets = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# "all" for both: unsound defaults to "workspace", which drops unsound advisories in
# transitive crates; unmaintained is written out so a cargo-deny default change cannot
# narrow it.
unmaintained = "all"
unsound = "all"
# Advisories to ignore — triaged as not applicable to a personal CLI tool
ignore = [
    # rsa 0.9.10: Marvin Attack timing side-channel. No fix in 0.9.x series (open since
    # 2023). Used only for JWT signing in octocrab GitHub API calls; not a signing oracle.
    "RUSTSEC-2023-0071",
    # proc-macro-error2 2.0.1: unmaintained (RUSTSEC-2026-0173). Used transitively via
    # clap_derive. No security impact — proc macro crate only affects compile time.
    # Will resolve when clap updates its derive machinery.
    "RUSTSEC-2026-0173",
    # smartstring 1.0.1: unmaintained (RUSTSEC-2026-0249). Reached only via rhai, which
    # is already at the latest 1.x (1.25.1, checked 2026-08-21) and still depends on it,
    # so there is no fix to take. Unmaintained, not vulnerable — it is a small-string
    # storage optimisation with no known advisory. Resolves when rhai drops it.
    "RUSTSEC-2026-0249",
    # unsafe-libyaml 0.2.11: unmaintained (RUSTSEC-2024-0449). Reached only via
    # serde_yaml_ng, already at the latest release (0.10.0, checked 2026-10-17) and
    # still depending on it, so there is no fix to take. Unmaintained, not vulnerable;
    # no advisory against it. Resolves when serde_yaml_ng drops it or etch moves parser.
    "RUSTSEC-2024-0449",
    # basic-toml 0.1.10: unmaintained (RUSTSEC-2026-0374). Reached only via
    # age -> i18n-embed-fl -> i18n-config, and i18n-config is at its latest release
    # (0.4.8, checked 2026-10-25) still requiring basic-toml ^0.1; age 0.12 reaches
    # the same i18n-config, so there is no fix to take. Unmaintained, not vulnerable.
    # Resolves when i18n-config moves to toml.
    "RUSTSEC-2026-0374",
    # crypto-bigint 0.5.5: timing variability (RUSTSEC-2026-0387), fixed only in 0.7.6.
    # Reached via octocrab -> jsonwebtoken -> p256/p384 -> elliptic-curve 0.13; the
    # latest jsonwebtoken (11.1.0, checked 2026-10-25) still requires p256 0.13, so
    # there is no fix to take. etch calls octocrab unauthenticated and never signs a
    # JWT, so no secret-dependent operation runs. Resolves when jsonwebtoken moves to
    # p256 0.14.
    "RUSTSEC-2026-0387",
]

[licenses]
# Allowed SPDX license identifiers
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # BSD-style permissive licence of bzip2 itself. Arrives with zip 9 through
    # libbz2-rs-sys, a Rust port of the bzip2 C library that zip 2 already linked
    # through bzip2-sys, so the licensed code is not new to the binary.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["brujack"]
