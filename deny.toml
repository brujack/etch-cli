[graph]
targets = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Advisories to ignore — triaged as not applicable to a personal CLI tool
ignore = [
    # hickory-proto 0.25.2: DNS DoS via O(n²) name compression / NSEC3 unbounded loop.
    # No attack surface: etch is a CLI, not a DNS server. Fix requires hickory 0.26+,
    # which is a major semver jump blocked by the hickory 0.25 pin.
    "RUSTSEC-2026-0119",
    "RUSTSEC-2026-0118",
    # rsa 0.9.10: Marvin Attack timing side-channel. No fix in 0.9.x series (open since
    # 2023). Used only for JWT signing in octocrab GitHub API calls; not a signing oracle.
    "RUSTSEC-2023-0071",
    # proc-macro-error2 2.0.1: unmaintained (RUSTSEC-2026-0173). Used transitively via
    # clap_derive. No security impact — proc macro crate only affects compile time.
    # Will resolve when clap updates its derive machinery.
    "RUSTSEC-2026-0173",
]

[licenses]
# Allowed SPDX license identifiers
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["brujack"]
