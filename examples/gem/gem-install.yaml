actions:
    # Install a single gem. Idempotent: skips if `gem list --installed <name>`
    # returns true. Requires `gem` on PATH (provided by the active Ruby).
    - action: gem.install
      name: bundler

    # version: install a specific version.
    - action: gem.install
      name: bundler
      version: "2.4.0"

    # list: install multiple gems in one action.
    - action: gem.install
      list:
          - bundler
          - rake
          - test-kitchen
          - kitchen-vagrant
          - kitchen-ansible
