# Example etch.yaml for a Mac workstation.
# Copy to ~/.config/etch/etch.yaml and adjust to match your machine's capabilities.
#
# After creating this file, bootstrap with:
#   mkdir -p ~/.config/etch
#   ln -s ~/git-repos/personal/dotfiles/etch.yaml ~/.config/etch/etch.yaml
# (or copy this file directly to ~/.config/etch/etch.yaml)

manifest_paths:
  - ~/git-repos/personal/dotfiles/manifests

variables:
  profile: "mac_workstation"
  has_gui: true
  has_devtools: true
  has_k8s: true
  has_docker: true
  has_rust: true
  has_printing: true
