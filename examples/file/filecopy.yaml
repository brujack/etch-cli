actions:
  # Template rendering with Tera (Jinja2-compatible syntax).
  # Source file is in the `files/` subdirectory next to this manifest.
  # All context namespaces are available: user.*, os.*, variables.*, env.*, manifest_dir.
  # IMPORTANT: manifest variables use the `variables.` prefix — {{ variables.my_var }},
  # NOT {{ my_var }} (bare names render empty without error).
  # See files/some-file.j2 for a full variable reference with examples.
  - action: file.copy
    from: some-file.j2
    to: /tmp/some-file-rendered
    template: true

  - action: file.copy
    from: procs-config.toml
    to: "{{ user.config_dir }}/procs/config.toml"

  # Decrypt file
  - action: file.copy
    from: encrypted-file
    to: /tmp/some-decrypted-file
    passphrase: "1KZ2EXDHSQKZFQP43JK2LPXUFZ8D365CM5WQXRSH97U7N9WKRVFKS0TCS30"

  - action: file.copy
    from: encrypted-file
    to: /tmp/some-decrypted-file-2
    passphrase: '{{ read_file_contents(path="examples/file/files/age-passphrase") }}'

  - action: file.copy
    from: encrypted-file
    to: /tmp/some-decrypted-file-3
    passphrase: '{{ get_env(name="AGE_PASSPHRASE") }}'

  - action: file.copy
    from: etch.jpg
    to: /tmp/etch.jpg

  - action: file.copy
    from: etch.jpg
    chmod: "0500"
    to: /tmp/etch2.jpg
