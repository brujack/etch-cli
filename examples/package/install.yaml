---
# package.install — install OS packages via Homebrew, apt, or snap
#
# Idempotent: skips packages that are already installed.
# Use name for a single package or list for multiple (mutually exclusive).
# Use where: to gate platform-specific actions.

actions:
  # --- Homebrew (macOS / Linux) ------------------------------------------

  # Install a single formula.
  - action: package.install
    name: ripgrep
    provider: homebrew

  # Install a list of packages in one action.
  - action: package.install
    list:
      - jq
      - fd
      - bat
      - fzf
    provider: homebrew

  # Install a Homebrew cask (GUI application).
  # cask: true passes --cask to brew install.
  - action: package.install
    name: visual-studio-code
    provider: homebrew
    cask: true

  # Install multiple casks at once.
  - action: package.install
    list:
      - alfred
      - iterm2
      - obsidian
    provider: homebrew
    cask: true

  # --- apt (Linux/Debian/Ubuntu) -----------------------------------------

  # Install a single package via apt.
  - action: package.install
    name: ripgrep
    provider: apt
    where: 'os.family == "linux"'

  # Install multiple packages via apt.
  - action: package.install
    list:
      - build-essential
      - curl
      - git
      - unzip
    provider: apt
    where: 'os.family == "linux"'

  # Pass extra flags to apt-get install (e.g. install a specific version).
  - action: package.install
    name: nodejs
    provider: apt
    extra_args:
      - nodejs=18.*
    where: 'os.family == "linux"'

  # Install from a local .deb file (file: true treats name as a file path).
  - action: package.install
    name: /tmp/mypackage.deb
    provider: apt
    file: true
    where: 'os.family == "linux"'

  # --- snap (Linux) -------------------------------------------------------

  # Install via snap. Gate on has_snap variable (set in etch.yaml on Linux).
  - action: package.install
    name: code
    provider: snap
    where: 'variables.has_snap'

  # --- OS-variant pattern ------------------------------------------------

  # Install the same logical package with the correct provider per OS.
  # The variants block overrides fields for a specific OS type.
  - action: package.install
    name: ripgrep
    provider: homebrew
    variants:
      Ubuntu:
        name: ripgrep
        provider: apt
