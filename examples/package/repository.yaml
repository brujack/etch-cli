actions:
  # Add a Homebrew tap before installing formulae from it.
  # Always add the tap before the package.install that uses it.
  - action: package.repository
    name: go-task/tap
    provider: homebrew

  # Then install a formula from the tap.
  - action: package.install
    name: go-task/tap/go-task
    provider: homebrew

  # Another tap example.
  - action: package.repository
    name: hashicorp/tap
    provider: homebrew

  - action: package.install
    name: hashicorp/tap/terraform
    provider: homebrew

  # apt repository (Linux) — name is the repository URL or sources.list entry.
  - action: package.repository
    name: "deb https://download.docker.com/linux/ubuntu focal stable"
    provider: apt
    where: 'os.family == "linux"'
