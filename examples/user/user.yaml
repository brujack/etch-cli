actions:
    # Create a system user. Idempotent: skips if username already exists.
    # Linux: uses `useradd`. macOS: uses `dscl`.
    # shell: path to the login shell (e.g. /bin/bash, /bin/zsh, sh).
    - action: user.add
      fullname: testuser
      home_dir: /home/test
      username: test
      shell: /bin/bash

    # Add an existing user to one or more groups (without recreating the user).
    # group: list of groups the user should be a member of.
    - action: user.group
      username: test
      group:
          - wheel
          - docker

    # Change the current user's default login shell. Idempotent: no-op if already correct.
    # Shell must be listed in /etc/shells — chsh errors otherwise.
    - action: user.default_shell
      shell: /bin/zsh

    # Change another user's default shell (requires privilege escalation).
    - action: user.default_shell
      shell: /bin/zsh
      username: bruce
      where: 'os.name == "linux"'
