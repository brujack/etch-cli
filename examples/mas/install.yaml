actions:
  # Install a Mac App Store app by numeric App Store ID.
  # name is for human readability only — etch uses id for the actual install.
  # Requires the `mas` CLI: brew install mas
  # Always pair with where: 'os.name == "macos"' since mas is macOS-only.
  - action: mas.install
    name: "1Blocker- Ad Blocker & Privacy"
    id: 1365531024
    where: 'os.name == "macos"'

  # Install multiple App Store apps in one action using list:.
  # Mutually exclusive with name: + id: (use one form or the other).
  - action: mas.install
    where: 'os.name == "macos"'
    list:
      - name: "Amphetamine"
        id: 937984704
      - name: "Better Rename 9"
        id: 414209656
      - name: "Flycut"
        id: 442160987

  # To find an app's numeric ID: mas search "App Name"
  # or look at the app's App Store URL: .../id<number>
