actions:
    # Download a binary from a GitHub release. Auto-detects platform (macOS/Linux)
    # and architecture from the release asset names. Idempotent: skips if
    # `{directory}/{name}` already exists.
    # repository: "owner/repo" — fetches the latest release.
    - action: binary.github
      name: etch
      repository: brujack/etch-cli
      directory: /usr/local/bin

    # version: pin to a specific release tag.
    # When pinned, etch apply writes a sidecar file {dir}/.{name}.version
    # on first install so etch status can detect drift:
    #   - Install mismatch: sidecar differs from the pinned version
    #   - Update available: pinned version is behind the latest GitHub release
    #     (checked via GitHub API with 1h TTL cache at
    #     ~/.cache/etch/github-versions/{owner}-{repo}.json)
    # No drift detection when version: is absent or "latest".
    - action: binary.github
      name: etch
      repository: brujack/etch-cli
      version: "v0.12.0"
      directory: "{{ user.home_dir }}/.local/bin"
