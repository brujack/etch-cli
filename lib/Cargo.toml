[package]
name = "etch-lib"
version = "0.12.0"
authors = ["David McKay <david@rawkode.dev>"]
edition = "2021"
license = "MIT"
description = "Core library for etch-cli"
repository = "https://github.com/brujack/etch-cli"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
age = { version = "0.11", features = ["armor"] }
dirs-next = "2.0"
file_diff = "1.0"
gethostname = "1.1"
glob = "0.3"
ignore = "0.4"
normpath = "1.5"
octocrab = "0.49"
os_info = { version = "3.14", features = ["schemars"] }
petgraph = "0.8"
rand = "0.10"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
] }
rhai = { version = "1.24", features = ["serde"] }
schemars = { version = "1.2", features = ["indexmap2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha256 = "1.6"
tokio = "1.49"
toml = "1.0"
tera = "1.20"
tracing = "0.1"
hickory-resolver = "0.25.2"
which = "8.0"
whoami = "2.1"
tar = "0.4.44"
flate2 = "1.1.9"
xz2 = "0.1"
zip = "2"
indexmap = { version = "2", features = ["serde"] }
file-owner = "0.1.2"
gix = { version = "0.80.0", features = [
    "status",
    "tracing",
    "tracing-detail",
    "blocking-http-transport-reqwest-rust-tls",
    "blocking-network-client",
] }
tealr = { version = "0.10.0", features = [
    "mlua_lua54",
    "mlua_anyhow",
    "mlua_async",
    "mlua_userdata-wrappers",
    "tealr_derive",
    "mlua_send",
    "mlua_serialize",
    "mlua",
    "mlua_error-send",
    "mlua_macros",
    "mlua_vendored",
] }
camino = { version = "1.2.2", features = ["serde1"] }
serde_with = { version = "3.17.0", features = ["schemars_1", "json"] }
parking_lot = "0.12.5"
shellexpand = "3"

[target.'cfg(unix)'.dependencies]
uzers = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.26"
pretty_assertions = "1.4"
proptest = "1"
serial_test = "3"
tracing-test = "0.2"
tracing-subscriber = "0.3"

[[bench]]
name = "etch_lib"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
